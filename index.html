<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b8b">
  <title>薬剤師体験 デジタルフォトフレーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">小学生のみなさんへ</p>
      <h1>薬剤師体験<br><span>デジタルフォトフレーム</span></h1>
    </header>

    <section id="cameraScreen" class="screen">
      <div class="camera-stage">
        <div id="cameraWindow" class="camera-window">
          <video id="video" autoplay muted playsinline></video>
        </div>

        <img id="frame" alt="フォトフレーム">

        <div id="flash"></div>
        <div id="certification">
          <div class="sparkles">✨✨✨</div>
          <div class="cert-title">薬剤師認定！</div>
        </div>
        <canvas id="confettiCanvas"></canvas>
      </div>

      <p id="frameLabel" class="frame-label"></p>

      <div class="controls">
        <button id="switchCamera" class="secondary" type="button">カメラ切替</button>
        <button id="shutter" class="shutter" type="button" aria-label="撮影"></button>
        <button id="changeFrame" class="secondary" type="button">フレーム変更</button>
      </div>
      <p class="camera-mode">現在：<span id="cameraModeText">背面カメラ</span></p>
      <p class="privacy">写真はサーバーへ送信されません。</p>
    </section>

    <section id="resultScreen" class="screen hidden">
      <h2>撮影できました！</h2>
      <img id="resultImage" alt="撮影した写真">
      <div class="result-controls">
        <button id="retake" class="secondary wide" type="button">撮り直す</button>
        <button id="save" class="primary wide" type="button">写真を保存</button>
      </div>
      <p class="save-note">iPhoneでは共有メニューから「画像を保存」を選んでください。</p>
    </section>

    <canvas id="captureCanvas" class="hidden"></canvas>
  </main>
  <script src="app.js"></script>
</body>
</html>
